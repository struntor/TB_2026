      &lt;div class=&quot;pipe-step&quot;&gt;&lt;strong&gt;1 · Rohdaten&lt;/strong&gt;&lt;span&gt;5-Minuten-OHLC je Symbol&lt;/span&gt;&lt;/div&gt;

      &lt;div class=&quot;pipe-step&quot;&gt;&lt;strong&gt;4 · Entry-Katalog&lt;/strong&gt;&lt;span&gt;16 versionierte Regeln, davon 11 aktuell ausgewählt&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;pipe-arrow&quot; aria-hidden=&quot;true&quot;&gt;→&lt;/div&gt;
      &lt;div class=&quot;pipe-step&quot;&gt;&lt;strong&gt;5 · Live-Filter&lt;/strong&gt;&lt;span&gt;Baseline-Track, 318 Symbol/Regel-Paare, 2 aktive Vetos&lt;/span&gt;&lt;/div&gt;

  &lt;/section&gt;

  &lt;section class=&quot;regime-section&quot; aria-labelledby=&quot;regime-heading&quot;&gt;
    &lt;h2 id=&quot;regime-heading&quot;&gt;Die Engine handelt Zustandswechsel, nicht isolierte Kerzen&lt;/h2&gt;

      &lt;g class=&quot;state bear&quot;&gt;&lt;rect x=&quot;245&quot; y=&quot;183&quot; width=&quot;95&quot; height=&quot;54&quot; rx=&quot;14&quot;&gt;&lt;/rect&gt;&lt;text x=&quot;292&quot; y=&quot;206&quot; text-anchor=&quot;middle&quot;&gt;bearish&lt;/text&gt;&lt;text x=&quot;292&quot; y=&quot;224&quot; text-anchor=&quot;middle&quot;&gt;attempt&lt;/text&gt;&lt;/g&gt;

  &lt;section aria-labelledby=&quot;patterns-heading&quot;&gt;
    &lt;h2 id=&quot;patterns-heading&quot;&gt;Vier Musterfamilien&lt;/h2&gt;
    &lt;div class=&quot;pattern-grid&quot;&gt;
      &lt;article class=&quot;pattern&quot;&gt;
        &lt;h3&gt;Crash-Reparatur &amp;amp; Re-Entry&lt;/h3&gt;
        &lt;svg class=&quot;pattern-chart&quot; viewBox=&quot;0 0 320 150&quot; role=&quot;img&quot; aria-label=&quot;V-förmige Crash-Reparatur mit Long-Entry über dem Reparaturhoch&quot;&gt;
          &lt;path class=&quot;grid-line&quot; d=&quot;M20 35 H300 M20 75 H300 M20 115 H300&quot;&gt;&lt;/path&gt;
          &lt;path class=&quot;price bull-line&quot; d=&quot;M25 35 L70 45 L105 118 L142 92 L180 100 L215 66 L260 50 L298 42&quot;&gt;&lt;/path&gt;
          &lt;path class=&quot;guide&quot; d=&quot;M178 66 H300&quot;&gt;&lt;/path&gt;&lt;text x=&quot;184&quot; y=&quot;59&quot;&gt;Breakout / Entry&lt;/text&gt;

        &lt;ul&gt;&lt;li&gt;Bärische Phase, danach belastbarer Rebuild.&lt;/li&gt;&lt;li&gt;Crash-Reversal: Stop unter Reparaturtief, Ziel 1R.&lt;/li&gt;&lt;li&gt;Post-Bear-Re-Entry: Tier 3, 3–15 Tage nach bearish, ≥5 HH/≥3 HL, starker Wochen-Rebuild.&lt;/li&gt;&lt;/ul&gt;

        &lt;h3&gt;Pullback, Reclaim &amp;amp; Add-on&lt;/h3&gt;
        &lt;svg class=&quot;pattern-chart&quot; viewBox=&quot;0 0 320 150&quot; role=&quot;img&quot; aria-label=&quot;Bullischer Trend mit höherem Tief, Reclaim-Entry und Add-on&quot;&gt;
          &lt;path class=&quot;grid-line&quot; d=&quot;M20 35 H300 M20 75 H300 M20 115 H300&quot;&gt;&lt;/path&gt;
          &lt;path class=&quot;price bull-line&quot; d=&quot;M25 115 L70 78 L105 92 L145 55 L180 76 L220 40 L250 58 L298 25&quot;&gt;&lt;/path&gt;
          &lt;path class=&quot;guide&quot; d=&quot;M132 62 H205&quot;&gt;&lt;/path&gt;&lt;text x=&quot;136&quot; y=&quot;54&quot;&gt;Reclaim&lt;/text&gt;
          &lt;circle class=&quot;entry-mark&quot; cx=&quot;145&quot; cy=&quot;55&quot; r=&quot;5&quot;&gt;&lt;/circle&gt;&lt;circle class=&quot;entry-mark&quot; cx=&quot;220&quot; cy=&quot;40&quot; r=&quot;5&quot;&gt;&lt;/circle&gt;
          &lt;text x=&quot;224&quot; y=&quot;34&quot;&gt;Add-on&lt;/text&gt;&lt;text x=&quot;164&quot; y=&quot;92&quot;&gt;frisches höheres Tief&lt;/text&gt;
        &lt;/svg&gt;
        &lt;ul&gt;&lt;li&gt;Pullback-Reclaim benötigt bullisches Regime und strukturelles höheres Tief.&lt;/li&gt;&lt;li&gt;Bestätigtes HL: Entry erst über dem Bestätigungshoch.&lt;/li&gt;&lt;li&gt;Add-on nur zu bestehendem Full-Size-Long und nach neuem Pullback-Anker.&lt;/li&gt;&lt;/ul&gt;
      &lt;/article&gt;
      &lt;article class=&quot;pattern&quot;&gt;
        &lt;h3&gt;Tier-3-Trendteilnahme&lt;/h3&gt;
        &lt;svg class=&quot;pattern-chart&quot; viewBox=&quot;0 0 320 150&quot; role=&quot;img&quot; aria-label=&quot;Treppenförmiger Tier-3-Aufwärtstrend mit projiziertem Hoch und Breakout&quot;&gt;
          &lt;path class=&quot;grid-line&quot; d=&quot;M20 35 H300 M20 75 H300 M20 115 H300&quot;&gt;&lt;/path&gt;
          &lt;path class=&quot;price bull-line&quot; d=&quot;M25 120 L62 85 L92 98 L130 64 L160 77 L198 48 L228 59 L268 30&quot;&gt;&lt;/path&gt;
          &lt;path class=&quot;guide&quot; d=&quot;M198 48 L268 30&quot;&gt;&lt;/path&gt;&lt;path class=&quot;guide dash&quot; d=&quot;M228 59 L285 43&quot;&gt;&lt;/path&gt;
          &lt;circle class=&quot;entry-mark&quot; cx=&quot;268&quot; cy=&quot;30&quot; r=&quot;5&quot;&gt;&lt;/circle&gt;&lt;text x=&quot;205&quot; y=&quot;22&quot;&gt;HH ≥6 · HL ≥5&lt;/text&gt;&lt;text x=&quot;214&quot; y=&quot;91&quot;&gt;Stop: letztes Tief&lt;/text&gt;
        &lt;/svg&gt;
        &lt;ul&gt;&lt;li&gt;Struktureller Breakout nach frischem höheren Tief.&lt;/li&gt;&lt;li&gt;Full Size bei starkem Trend; Small Participation sonst 0,25×.&lt;/li&gt;&lt;li&gt;Projected High: kleiner Hoch-Schritt ≤0,5 ATR wird um den doppelten Schritt projiziert.&lt;/li&gt;&lt;/ul&gt;

          &lt;path class=&quot;guide&quot; d=&quot;M20 75 H300&quot;&gt;&lt;/path&gt;&lt;text x=&quot;25&quot; y=&quot;69&quot;&gt;gebrochener Support&lt;/text&gt;
          &lt;circle class=&quot;short-mark&quot; cx=&quot;215&quot; cy=&quot;100&quot; r=&quot;5&quot;&gt;&lt;/circle&gt;&lt;circle class=&quot;short-mark&quot; cx=&quot;252&quot; cy=&quot;82&quot; r=&quot;5&quot;&gt;&lt;/circle&gt;
          &lt;text x=&quot;160&quot; y=&quot;54&quot;&gt;Lower High / Fail-Zone&lt;/text&gt;&lt;text x=&quot;220&quot; y=&quot;118&quot;&gt;Breakdown&lt;/text&gt;

        &lt;ul&gt;&lt;li&gt;Gap-Breakdown: bestätigter Supportbruch, sichtbare tiefere Tiefs, kein Retest.&lt;/li&gt;&lt;li&gt;Lower-High-Failure: Bounce bleibt unter früherem Hoch und scheitert wieder.&lt;/li&gt;&lt;li&gt;Failed Countermove: reifer Bruch, Entscheidung und Vortagesschluss unter Fail-Zone.&lt;/li&gt;&lt;/ul&gt;

  &lt;section aria-labelledby=&quot;veto-heading&quot;&gt;
    &lt;h2 id=&quot;veto-heading&quot;&gt;Die zwei aktiven Vetos&lt;/h2&gt;
    &lt;div class=&quot;veto-grid&quot;&gt;
      &lt;article&gt;
        &lt;h3&gt;1 · Weak-Retest-Veto&lt;/h3&gt;
        &lt;div class=&quot;logic-chain&quot; role=&quot;img&quot; aria-label=&quot;Alle fünf Bedingungen müssen gleichzeitig wahr sein, damit der Failed-Countermove-Short verworfen wird&quot;&gt;
          &lt;span&gt;Failed Countermove&lt;/span&gt;&lt;b&gt;+&lt;/b&gt;&lt;span&gt;Short&lt;/span&gt;&lt;b&gt;+&lt;/b&gt;&lt;span&gt;Struktur unklassifiziert&lt;/span&gt;&lt;b&gt;+&lt;/b&gt;&lt;span&gt;normales Trendvolumen&lt;/span&gt;&lt;b&gt;+&lt;/b&gt;&lt;span&gt;schwacher Retest&lt;/span&gt;&lt;b&gt;→&lt;/b&gt;&lt;span class=&quot;blocked&quot;&gt;Trade verwerfen&lt;/span&gt;
        &lt;/div&gt;
      &lt;/article&gt;
      &lt;article&gt;
        &lt;h3&gt;2 · Kausales LHF-Cluster-Veto&lt;/h3&gt;
        &lt;svg class=&quot;veto-timeline&quot; viewBox=&quot;0 0 700 145&quot; role=&quot;img&quot; aria-label=&quot;In den zwei Kalendertagen vor dem neuen Lower-High-Failure-Short werden nur bereits geschlossene Core-Short-Verluste gezählt&quot;&gt;
          &lt;path class=&quot;axis&quot; d=&quot;M45 82 H655&quot;&gt;&lt;/path&gt;
          &lt;path class=&quot;window&quot; d=&quot;M92 55 H470 V110 H92 Z&quot;&gt;&lt;/path&gt;
